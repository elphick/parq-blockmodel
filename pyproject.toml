[project]
name = "parq-blockmodel"
version = "0.14.0"
description = "A Python package for efficient storage, manipulation, and analysis of mining block models using Parquet files."
authors = [
    { name = "Greg Elphick", email = "11791585+elphick@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.11,<3.14"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyarrow>=16.0",
    "parq-tools>=0.5.3",  # can use the profiling extra when we no longer need to pin fg-data-profiling
    "scipy>=1.11",
]

[project.optional-dependencies]
schema = [
    "pandera>=0.19",
    "df-eval>=0.2.1"]
profiling = [
    "fg-data-profiling>=4.19.0,<4.19.1",  # 4.19.1 wheel is mispackaged (missing data_profiling/__init__.py)
    "setuptools<81"]  # ydata-profiling still imports pkg_resources; keep setuptools<81
viz = [
    "pyvista>=0.44.2",
    "plotly>=6.1.1",
    "kaleido>=1.1.0,<2",
]
spatial = [
    "shapely>=2",
    "geopandas>=1.1.1",
]
server-viz = [
    "pyvista>=0.44.2",
    "trame>=3.10.2,<4",
    "trame-vtk>=2.9.0,<3",
    "trame-vuetify>=3.0.1,<4",
]
temporal = [
    "rioxarray>=0.18.0",
    "imageio>=2.37.0,<3",
    "imageio-ffmpeg>=0.6.0,<1",
]
mesh = ["plyfile>=1.0.0"]
cad = ["ezdxf>=1.3.0"]
all = [
    "fg-data-profiling>=4.19.0,<4.19.1",  # 4.19.1 wheel is mispackaged
    "setuptools<81",
    "rioxarray>=0.18.0",
    "imageio>=2.37.0,<3",
    "imageio-ffmpeg>=0.6.0,<1",
    "pyvista>=0.44.2",
    "shapely>=2",
    "geopandas>=1.1.1",
    "plotly>=6.1.1",
    "kaleido>=1.1.0,<2",
    "trame>=3.10.2,<4",
    "trame-vtk>=2.9.0,<3",
    "trame-vuetify>=3.0.1,<4",
    "plyfile>=1.0.0",
    "ezdxf>=1.3.0",
    "pandera>=0.19",
    "df-eval>=0.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.1,<9",
    "sphinx>=7.3.7,<8",
    "sphinx-gallery>=0.14.0,<1",
    "sphinx-rtd-theme>=2.0.0,<3",
    "myst-parser>=3.0.1,<4",
    "sphinx-autodoc-typehints>=2.1.1,<3",
    "matplotlib>=3.7.2,<4",
    "coverage>=7.8.0,<8",
    "plotly>=6.1.1",
    "kaleido>=1.1.0,<2",
    "sphinx-book-theme>=1.2.0,<2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: multi-layer tests that cross module boundaries (e.g., file I/O + mesh export)",
    "slow: expensive tests excluded from the default fast lane",
    "gui: tests that require an interactive display or rendering backend",
]

[tool.coverage.run]
branch = true
source = ["parq_blockmodel"]

[tool.coverage.report]
show_missing = true
skip_covered = false
omit = [
    "tests/*",
    "test_*.py",
    "docs/*",
    "examples/*",
    "scratch/*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parq_blockmodel"]
